plugins {
    id "net.neoforged.moddev" version "2.0.147"
}

version = "${project.mc_version}-${project.mod_version}"
group = project.mod_group
base.archivesName = project.archive_name

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file("run")
        }
        server {
            server()
            gameDirectory = project.file("runServer")
        }
    }

    mods {
        mts {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // Cursemaven hosts the JEI and Jade artifacts for optional integration.
    maven { url = "https://www.cursemaven.com" }
}

configurations {
    embed
    // Use compileOnly so mccore classes are available at compile time but do NOT
    // appear on the runtime module path. The jar task below unpacks embed into the
    // fat JAR, so the classes are present at runtime inside the mod JAR itself.
    // Using implementation here would place mccore (and its jorbis/jlayer classes)
    // on the module path as a separate module, causing JPMS split-package errors.
    compileOnly.extendsFrom(embed)
}

dependencies {
    // Embed mccore as a pre-built relocated fat-jar. mccore cannot be a project
    // dependency here because its shadow plugin (7.1.2) is incompatible with this
    // module's Gradle 9 wrapper. Build it first with the root build's
    // `:mccore:shadowJar` (wired as a dependency of the buildForge262 task).
    // The relocated jar has javazoom relocated and already contains jorbis/jlayer.
    // Without the exclusion below, JPMS sees duplicate packages (com.jcraft.jorbis etc.)
    // in both the mts module and the standalone jorbis module, causing a ResolutionException.
    embed(files("../mccore/build/libs/Immersive Vehicles-Core-relocated.jar"))
    // Dev runs launch from the source set, not the fat jar, so mccore must also be on the
    // runtime classpath there. The jar is not published, and NeoForge dev runs use a plain
    // classpath (no JPMS), so the jorbis duplicate is harmless.
    runtimeOnly files("../mccore/build/libs/Immersive Vehicles-Core-relocated.jar")
    compileOnly "curse.maven:jei-238222:${project.jei_file_id}"
    runtimeOnly "curse.maven:jei-238222:${project.jei_file_id}"
    compileOnly "curse.maven:jade-324717:${project.jade_file_id}"
}

jar {
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // Exclude JOrbis/JOgg classes from the fat JAR.
    // NeoForge uses JPMS and the game already includes jorbis as a separate
    // module on the module path. Having com.jcraft.* packages in both our mod JAR
    // and the standalone jorbis module causes a split-package ResolutionException.
    // The classes remain available at runtime via the jorbis module.
    // NOTE: javazoom (JLayer/MP3) is NOT excluded — it is not provided by NeoForge.
    exclude "com/jcraft/**"
    exclude "META-INF/maven/org.jcraft/**"
    manifest {
        attributes(["MixinConfigs": "mts.mixins.json",
                     "Implementation-Version": project.mod_version])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked" << "-Xmaxerrs" << "10000"
}
